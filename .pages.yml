# Dashboard configuration for Pages CMS (app.pagescms.org).
# Saving in the dashboard commits to this repo, which rebuilds and redeploys
# the site.

media:
  input: assets/uploads
  output: assets/uploads

content:
  - name: work
    label: Work
    type: collection
    path: content/work
    filename: "{fields.slug}.json"
    format: json
    view:
      fields: [title, location, order, published]
      primary: title
      sort: [order, title]
    fields:
      - name: title
        label: Job name
        type: string
        required: true
        description: 'Shown under the picture, e.g. "Victorian terrace, Fishtown".'

      - name: slug
        label: File name
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: Lowercase letters, numbers and hyphens only, for example "fishtown-terrace".
        description: Only used to name the file. Lowercase with hyphens.

      - name: published
        label: Show on site
        type: boolean
        default: true
        description: Turn off to hide this job without deleting it. While no job is shown, the Work section is left off the site entirely.

      - name: order
        label: Position
        type: number
        default: 1
        description: Lower numbers appear first.

      - name: location
        label: Location
        type: string
        description: Neighbourhood or town. Avoid full street addresses for clients' homes.

      - name: date
        label: Date
        type: string
        description: "e.g. 2026, or March 2026."

      - name: summary
        label: Summary
        type: text
        description: One or two sentences on the home, what was scanned, and what the client received.

      - name: cover
        label: Cover image
        type: image
        description: Shown on the card. Leave blank and the first gallery image is used. Export around 2000px wide as a JPG.

      - name: tourUrl
        label: 3D tour link
        type: string
        description: "Optional. A Realsee link (https://realsee.ai/…) or Matterport share link (https://my.matterport.com/show/?m=…) plays inside the page; any other link becomes a button. With no cover image, the card shows a 3D tour placeholder, so add a cover for a better thumbnail."

      - name: images
        label: Gallery
        type: object
        list: true
        description: Marketing plans, schematic plans, renders, point-cloud views. Shown full width and never cropped.
        fields:
          - name: src
            label: Image
            type: image
          - name: caption
            label: Caption
            type: string

  - name: site
    label: Site text
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: name, label: Business name, type: string }
      - { name: siteUrl, label: Site address, type: string, description: "The site's full address, ending in /. Used for link previews. Change it when a custom domain goes live." }
      - { name: eyebrow, label: Label above headline, type: string, description: 'A few words, e.g. "Residential & commercial". Leave blank to hide.' }
      - { name: tagline, label: Headline, type: string }
      - { name: intro, label: Intro, type: text }
      - { name: ctaLabel, label: Button text, type: string }
      - name: tiers
        label: Pricing tiers
        type: object
        list: true
        description: "Prices are numbers, and the card text and the size estimator are both worked out from them. A tier uses either Flat price or Per sq ft, not both: leave the other at 0."
        fields:
          - { name: name, label: Tier name, type: string }
          - { name: includes, label: What's included, type: text }
          - { name: short, label: One-line summary (phones), type: string, description: 'Shown in the phone layout\'s package list, e.g. "Branded tour + marketing plan". Keep it short.' }
          - { name: flat, label: Flat price ($), type: number, description: "e.g. 89. Leave 0 for per-square-foot tiers." }
          - { name: flatUpTo, label: Flat price covers up to (sq ft), type: number, description: "e.g. 2000" }
          - { name: overRate, label: Extra per sq ft above that ($), type: number, description: "e.g. 0.03" }
          - { name: rate, label: Per sq ft ($), type: number, description: "e.g. 0.10. Leave 0 for flat-price tiers." }
          - { name: min, label: Minimum ($), type: number, description: "e.g. 159" }
          - { name: hosting, label: Hosting per month ($), type: number, description: "Added to the first invoice. 0 if hosting is free." }
          - { name: hostingNote, label: Hosting note, type: string, description: 'Shown when hosting is 0, e.g. "Hosting free on Zillow".' }
          - { name: deliverables, label: Deliverables, type: string, list: true, description: 'Listed in the booking form and the booking email, e.g. "Zillow 3D tour", "Zillow plan".' }
          - { name: featured, label: Highlight this tier, type: boolean }
      - { name: pricingNote, label: Note under pricing, type: text }
      - name: compare
        label: Tour comparison
        type: object
        description: The section under pricing comparing the Zillow tour with the branded tour. Remove every option to hide it.
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro, type: text }
          - name: options
            label: Options
            type: object
            list: true
            fields:
              - { name: title, label: Title, type: string }
              - { name: tag, label: Package label, type: string, description: 'Small label above the title, e.g. "Basic".' }
              - { name: points, label: Points, type: string, list: true }
              - { name: featured, label: Highlight, type: boolean }
          - { name: both, label: Closing line, type: text, description: Shown under the two cards. }
      - name: plans
        label: Schematic plans
        type: object
        description: "The schematic plans section and booking option. Say \"schematic plan\" here, never \"floor plan\" or \"marketing plan\". Prices work like the tiers: Flat price, or Per sq ft with a Minimum. Leave both at 0 to show Quoted."
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro, type: text }
          - { name: name, label: Base drawing set, type: string, description: 'e.g. "Existing conditions". Clear it to hide the whole section.' }
          - { name: includes, label: What's included, type: text }
          - { name: short, label: One-line summary (phones), type: string }
          - { name: flat, label: Flat price ($), type: number }
          - { name: rate, label: Per sq ft ($), type: number }
          - { name: min, label: Minimum ($), type: number }
          - name: addons
            label: Add-ons
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string }
              - { name: text, label: Description, type: text }
              - { name: flat, label: Flat price ($), type: number }
              - { name: rate, label: Per sq ft ($), type: number }
              - { name: min, label: Minimum ($), type: number }
              - name: per
                label: Priced per square foot of
                type: select
                default: building
                options:
                  values:
                    - { value: building, label: "The building" }
                    - { value: changes, label: "The proposed changes (visitor enters it separately)" }
          - { name: tourHosting, label: Branded tour hosting ($/mo), type: number, description: "Schematic plan clients can keep the branded Realsee tour from the same scan for this monthly fee. 0 hides the option." }
          - { name: note, label: Note under the section, type: text }
      - name: steps
        label: How it works
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Description, type: text }
      - { name: workIntro, label: Work section intro, type: string }
      - { name: about, label: About, type: text }
      - { name: area, label: Area served, type: string }
      - { name: email, label: Email, type: string }
      - { name: phone, label: Phone, type: string, description: Optional. Leave blank to hide. }
